<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Monde artificiel</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='7' fill='%2330784a'/%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="scene"></div>
    <header class="barre">
      <h1>Monde artificiel</h1>
      <span id="statut" class="statut">Connexion au serveur…</span>
      <span id="date" class="date"></span>
      <span id="population" class="population"></span>
      <div id="vitesses" class="vitesses" role="group" aria-label="Vitesse du temps"></div>
      <form id="formGraine" class="graine">
        <button type="button" id="boutonRessources" title="Ressources des terres (rouge : épuisées) et régions en sécheresse (cadre orange) ou très arrosées (cadre bleu)">Ressources</button>
        <button type="button" id="boutonCommunautes" title="Les groupes qui vivent ensemble">Communautés</button>
        <button type="button" id="boutonTerritoires" title="Terres parcourues par chaque communauté, aujourd'hui et au fil des saisons">Territoires</button>
        <button type="button" id="boutonCatastrophes" title="Séismes, volcans, feux, crues, tempêtes, épidémies, phénomènes du ciel">Catastrophes</button>
        <button type="button" id="boutonDemographie" title="Courbes de population du monde et des communautés les plus peuplées, naissances et morts, avec les catastrophes et les guerres en repère">Démographie</button>
        <button type="button" id="boutonJournal" title="Naissances, morts, couples… filtrables par humain">Journal</button>
        <button type="button" id="boutonMonde" title="Surface et dimensions du continent, relief, eaux, terrains, climat, population, marche">Monde</button>
        <button type="button" id="boutonMesure" title="Mesurer une distance et le temps de marche entre deux points de la carte">📏 Mesurer</button>
        <button type="button" id="boutonConfiguration" title="Réglages du monde (graine, couples, taille de la carte, continents, départ des couples) ; sauvegardes à restaurer ; aperçu et création d'un nouveau monde">⚙ Configuration</button>
      </form>
    </header>
    <section id="panneauTemps" class="temps" aria-label="Contrôle du temps">
      <div class="ligne">
        <label for="curseurVitesse">Vitesse libre</label>
        <input id="curseurVitesse" type="range" min="0" step="1" />
        <span id="vitesseDemandee" class="valeur"></span>
        <span id="vitesseAtteinte" class="valeur discret"></span>
      </div>
      <div class="ligne">
        <span>Pas à pas</span>
        <button type="button" data-pas="pas" title="Met en pause, puis avance de 10 minutes">+10 min</button>
        <button type="button" data-pas="heure" title="Met en pause, puis avance d'une heure">+1 h</button>
        <button type="button" data-pas="jour" title="Met en pause, puis avance d'un jour">+1 jour</button>
      </div>
      <form id="formObjectif" class="ligne">
        <label for="typeObjectif">Aller jusqu'à</label>
        <select id="typeObjectif">
          <option value="matin">demain matin</option>
          <option value="saison">la prochaine saison</option>
          <option value="annee">la prochaine année</option>
          <option value="naissance">la prochaine naissance</option>
          <option value="mort">la prochaine mort</option>
          <option value="date">une date…</option>
        </select>
        <span id="champsDate" class="champs-date" hidden>
          an <input id="objAnnee" type="number" min="1" step="1" />
          saison <select id="objSaison"><option value="1">printemps</option><option value="2">été</option><option value="3">automne</option><option value="4">hiver</option></select>
          jour <input id="objJour" type="number" min="1" max="90" step="1" />
          heure <input id="objHeure" type="number" min="0" max="23" step="1" />
        </span>
        <button type="submit">Aller</button>
      </form>
      <div id="objectifEnCours" class="ligne objectif" hidden>
        <span id="texteObjectif"></span>
        <button type="button" id="annulerObjectif">Arrêter</button>
      </div>
      <label class="ligne discret"><input id="reprendreVitesse" type="checkbox" /> Au redémarrage du serveur, reprendre la dernière vitesse (sinon : pause)</label>
      <label class="ligne discret"><input id="pauseCatastrophe" type="checkbox" /> Mettre en pause quand une catastrophe menace des humains</label>
    </section>
    <dialog id="dialogueReinit" class="dialogue">
      <form method="dialog">
        <h2>Créer un nouveau monde ?</h2>
        <p id="texteNouveauMonde"></p>
        <menu>
          <button value="annuler" autofocus>Annuler</button>
          <button value="confirmer" class="danger">Créer ce monde</button>
        </menu>
      </form>
    </dialog>
    <aside id="fiche" class="fiche panneau-lateral" aria-label="Fiche de l'humain" hidden></aside>
    <aside id="journal" class="journal-panneau panneau-lateral" aria-label="Journal du monde" hidden></aside>
    <aside id="catastrophes" class="catastrophes-panneau panneau-lateral" aria-label="Catastrophes" hidden></aside>
    <aside id="configuration" class="monde-panneau config-panneau panneau-lateral" aria-label="Configuration" hidden></aside>
    <aside id="demographie" class="demographie-panneau panneau-lateral" aria-label="Démographie" hidden></aside>
    <aside id="caracteristiques" class="monde-panneau panneau-lateral" aria-label="Caractéristiques du Monde" hidden></aside>
    <div id="alerte" class="alerte-catastrophe" role="alert" hidden></div>
    <div id="extinction" class="alerte-catastrophe grave extinction" role="alert" hidden>
      <span id="texteExtinction"></span>
      <button type="button" id="extinctionRestaurer">Restaurer une sauvegarde</button>
      <button type="button" id="extinctionNouveau">Créer un nouveau monde</button>
      <button type="button" class="fermer" id="extinctionFermer" title="Fermer : la nature continue seule si vous relancez le temps">×</button>
    </div>
    <aside id="communautes" class="communautes-panneau panneau-lateral" aria-label="Communautés" hidden></aside>
    <section id="panneauTerritoires" class="territoires" aria-label="Terres des communautés" hidden></section>
    <aside id="infos" class="infos">Survole la carte pour voir une tuile. Molette : zoom · glisser : déplacer.</aside>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
