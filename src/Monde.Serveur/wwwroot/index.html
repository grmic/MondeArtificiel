<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Monde artificiel</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='7' fill='%2330784a'/%3E%3C/svg%3E" />
    <script type="module" crossorigin src="/assets/index-D_5Ga3dG.js"></script>
  </head>
  <body>
    <div id="scene"></div>
    <header class="barre">
      <h1 data-t="app.titre"></h1>
      <span id="statut" class="statut" data-t="connexion.enCours"></span>
      <span id="date" class="date"></span>
      <span id="population" class="population"></span>
      <div id="vitesses" class="vitesses" role="group" data-t-aria-label="temps.vitesseDuTemps"></div>
      <form id="formGraine" class="graine">
        <button type="button" id="boutonRessources" data-t="barre.ressources" data-t-title="barre.ressourcesAide"></button>
        <button type="button" id="boutonCalques" data-t="barre.calques" data-t-title="barre.calquesAide"></button>
        <label class="case-barre" data-t-title="barre.reservesAide"><input id="voirReserves" type="checkbox" checked /> <span data-t="barre.reserves"></span></label>
        <button type="button" id="boutonCommunautes" data-t="barre.communautes" data-t-title="barre.communautesAide"></button>
        <button type="button" id="boutonTerritoires" data-t="barre.territoires" data-t-title="barre.territoiresAide"></button>
        <button type="button" id="boutonCatastrophes" data-t="barre.catastrophes" data-t-title="barre.catastrophesAide"></button>
        <button type="button" id="boutonDemographie" data-t="barre.demographie" data-t-title="barre.demographieAide"></button>
        <button type="button" id="boutonDecouvertes" data-t="barre.decouvertes" data-t-title="barre.decouvertesAide"></button>
        <button type="button" id="boutonRemarquables" data-t="barre.remarquables" data-t-title="barre.remarquablesAide"></button>
        <button type="button" id="boutonPrieres" data-t="barre.prieres" data-t-title="barre.prieresAide"></button>
        <button type="button" id="boutonReligions" data-t="barre.religions" data-t-title="barre.religionsAide"></button>
        <button type="button" id="boutonSuivis" data-t="barre.suivis" data-t-title="barre.suivisAide"></button>
        <button type="button" id="boutonJournal" data-t="barre.journal" data-t-title="barre.journalAide"></button>
        <button type="button" id="boutonMonde" data-t="barre.monde" data-t-title="barre.mondeAide"></button>
        <button type="button" id="boutonMesure" data-t="barre.mesurer" data-t-title="barre.mesurerAide"></button>
        <button type="button" id="boutonConfiguration" data-t="barre.configuration" data-t-title="barre.configurationAide"></button>
      </form>
    </header>
    <section id="panneauCalques" class="panneau-calques" data-t-aria-label="barre.calques" hidden></section>
    <section id="panneauTemps" class="temps" data-t-aria-label="temps.controle">
      <div class="ligne">
        <label for="curseurVitesse" data-t="temps.vitesseLibre"></label>
        <input id="curseurVitesse" type="range" min="0" step="1" />
        <span id="vitesseDemandee" class="valeur"></span>
        <span id="vitesseAtteinte" class="valeur discret"></span>
        <button type="button" id="reduireTemps" class="reduire" data-t-title="temps.reduireAide" aria-expanded="true">▴</button>
      </div>
      <div class="ligne">
        <span data-t="temps.pasAPas"></span>
        <button type="button" data-pas="pas" data-t="temps.plus10min" data-t-title="temps.plus10minAide"></button>
        <button type="button" data-pas="heure" data-t="temps.plus1h" data-t-title="temps.plus1hAide"></button>
        <button type="button" data-pas="jour" data-t="temps.plus1jour" data-t-title="temps.plus1jourAide"></button>
      </div>
      <form id="formObjectif" class="ligne">
        <label for="typeObjectif" data-t="temps.allerJusqua"></label>
        <select id="typeObjectif">
          <option value="matin" data-t="temps.objectif.matin"></option>
          <option value="saison" data-t="temps.objectif.saison"></option>
          <option value="annee" data-t="temps.objectif.annee"></option>
          <option value="naissance" data-t="temps.objectif.naissance"></option>
          <option value="mort" data-t="temps.objectif.mort"></option>
          <option value="date" data-t="temps.objectif.date"></option>
        </select>
        <span id="champsDate" class="champs-date" hidden>
          <span data-t="temps.champ.an"></span> <input id="objAnnee" type="number" min="1" step="1" />
          <span data-t="temps.champ.saison"></span> <select id="objSaison"><option value="1" data-t="saison.printemps"></option><option value="2" data-t="saison.ete"></option><option value="3" data-t="saison.automne"></option><option value="4" data-t="saison.hiver"></option></select>
          <span data-t="temps.champ.jour"></span> <input id="objJour" type="number" min="1" max="90" step="1" />
          <span data-t="temps.champ.heure"></span> <input id="objHeure" type="number" min="0" max="23" step="1" />
        </span>
        <button type="submit" data-t="temps.aller"></button>
      </form>
      <div id="objectifEnCours" class="ligne objectif" hidden>
        <span id="texteObjectif"></span>
        <button type="button" id="annulerObjectif" data-t="temps.arreter"></button>
      </div>
      <label class="ligne discret"><input id="reprendreVitesse" type="checkbox" /> <span data-t="temps.reprendreVitesse"></span></label>
      <label class="ligne discret"><input id="pauseCatastrophe" type="checkbox" /> <span data-t="temps.pauseCatastrophe"></span></label>
    </section>
    <dialog id="dialogueReinit" class="dialogue">
      <form method="dialog">
        <h2 data-t="nouveauMonde.question"></h2>
        <p id="texteNouveauMonde"></p>
        <label class="ligne"><input id="garderAncienMonde" type="checkbox" checked /> <span data-t="nouveauMonde.garder"></span></label>
        <menu>
          <button value="annuler" autofocus data-t="commun.annuler"></button>
          <button value="confirmer" class="danger" data-t="nouveauMonde.creer"></button>
        </menu>
      </form>
    </dialog>
    <aside id="fiche" class="fiche panneau-lateral" data-t-aria-label="fiche.titre" hidden></aside>
    <aside id="ficheCommunaute" class="fiche fiche-communaute panneau-lateral" data-t-aria-label="ficheCommunaute.titre" hidden></aside>
    <aside id="journal" class="journal-panneau panneau-lateral" data-t-aria-label="journal.titre" hidden></aside>
    <aside id="catastrophes" class="catastrophes-panneau panneau-lateral" data-t-aria-label="barre.catastrophes" hidden></aside>
    <aside id="configuration" class="monde-panneau config-panneau panneau-lateral" data-t-aria-label="barre.configuration" hidden></aside>
    <aside id="demographie" class="demographie-panneau panneau-lateral" data-t-aria-label="barre.demographie" hidden></aside>
    <aside id="decouvertes" class="demographie-panneau panneau-lateral" data-t-aria-label="barre.decouvertes" hidden></aside>
    <aside id="suivis" class="journal-panneau panneau-lateral" data-t-aria-label="barre.suivis" hidden></aside>
    <aside id="remarquables" class="demographie-panneau panneau-lateral" data-t-aria-label="barre.remarquables" hidden></aside>
    <aside id="prieres" class="demographie-panneau panneau-lateral" data-t-aria-label="barre.prieres" hidden></aside>
    <aside id="religions" class="demographie-panneau panneau-lateral" data-t-aria-label="barre.religions" hidden></aside>
    <aside id="caracteristiques" class="monde-panneau panneau-lateral" data-t-aria-label="monde.titre" hidden></aside>
    <div id="alerte" class="alertes" role="alert" aria-live="assertive" hidden></div>
    <div id="extinction" class="alerte-catastrophe grave extinction" role="alert" hidden>
      <span id="texteExtinction"></span>
      <button type="button" id="extinctionRestaurer" data-t="extinction.restaurer"></button>
      <button type="button" id="extinctionNouveau" data-t="extinction.nouveau"></button>
      <button type="button" class="fermer" id="extinctionFermer" data-t-title="extinction.fermerAide">×</button>
    </div>
    <aside id="communautes" class="communautes-panneau panneau-lateral" data-t-aria-label="barre.communautes" hidden></aside>
    <section id="panneauTerritoires" class="territoires" data-t-aria-label="territoires.titre" hidden></section>
    <aside id="infos" class="infos" data-t="carte.survol"></aside>
  </body>
</html>
